<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Movie Day</title>
        <style>
        *{
            box-sizing: border-box;
            margin: 0 auto;
        }
        #khung{
            width: 600px;
            border: 2px solid rgba(247, 241, 241, 0.5);
            margin-top: 20px;
            padding: 5px;
        }
        table, th, td{
            border: 1px solid black;
            text-align: left;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <div id="khung">
        <table cellpadding="10">
            <caption>Classic Movie Day</caption>
            <tr>
                <th>&nbsp</th>
                <th>5pm</th>
                <th>7pm</th>
                <th>9pm</th>
                <th>11pm</th>
            </tr>
            <tr>
                <th>Screen one</th>
                <td>Star Wars</td>
                <td>Empire Strikes Back</td>
                <td>Return of the Jedi</td>
                <td>The Exorcist</td>
            </tr>
            <tr>
                <th>Screen two</th>
                <td colspan="2">Dances with Wolves</td>
                <td colspan="2">Gone with the Wind</td>
            </tr>
                <tr>
                <th>Screen three</th>
                <td colspan="2">2001: A Space Odyssey</td>
                <td>The Conversation</td>
                <td>5 Easy Pieces</td>
            </tr>
        </table>
    </div>
</body>
</html>
